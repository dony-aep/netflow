name: netflow
description: "NetFlow - Monitor de uso de datos móviles y WiFi en tiempo real"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # Iconos
  cupertino_icons: ^1.0.8

  # Gestión de estado
  provider: ^6.1.5

  # Base de datos local
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.5

  # Permisos
  permission_handler: ^12.0.1

  # Notificaciones y servicio en foreground
  flutter_local_notifications: ^20.0.0
  flutter_foreground_task: ^9.2.0

  # Conectividad y estadísticas de red
  connectivity_plus: ^7.0.0
  network_info_plus: ^7.0.0
  netflow_traffic_stats:
    path: plugins/netflow_traffic_stats

  # UI y Diseño - Material Design 3
  intl: ^0.20.2

  # Gráficos para historial
  fl_chart: ^1.1.1
  package_info_plus: ^9.0.0
  http: ^1.6.0
  url_launcher: ^6.3.2
  dio: ^5.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Logo de la aplicación
  assets:
    - assets/images/app_logo.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/static/GoogleSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/static/GoogleSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/static/GoogleSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/static/GoogleSans-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/static/GoogleSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/static/GoogleSans-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/static/GoogleSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/static/GoogleSans-BoldItalic.ttf
          weight: 700
          style: italic
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
